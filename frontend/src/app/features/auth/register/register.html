<div class="auth-page">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Create your account</h1>

    <label class="auth-form__field">
      <span>First name</span>
      <input type="text" formControlName="firstName" autocomplete="given-name" />
      @if (form.controls.firstName.invalid && form.controls.firstName.touched) {
        <span class="auth-form__error">First name is required.</span>
      }
    </label>

    <label class="auth-form__field">
      <span>Last name</span>
      <input type="text" formControlName="lastName" autocomplete="family-name" />
      @if (form.controls.lastName.invalid && form.controls.lastName.touched) {
        <span class="auth-form__error">Last name is required.</span>
      }
    </label>

    <label class="auth-form__field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="auth-form__error">Enter a valid email.</span>
      }
    </label>

    <label class="auth-form__field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="auth-form__error">Password must be at least 8 characters.</span>
      }
    </label>

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Creating account...' : 'Register' }}
    </button>

    <p class="auth-form__switch">
      Already have an account? <a [routerLink]="['/', routeNames.Login]">Log in</a>
    </p>
  </form>
</div>
